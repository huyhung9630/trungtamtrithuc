<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat – Tri Thức</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #1e40af;
      --accent-hover: #1d3a9f;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-400: #9ca3af;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --white: #ffffff;
    }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: var(--gray-50);
      color: var(--gray-800);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    nav {
      background: var(--white);
      border-bottom: 1px solid var(--gray-200);
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      height: 56px;
      gap: 1.5rem;
      flex-shrink: 0;
    }
    .nav-brand { font-size: 1rem; font-weight: 700; color: var(--accent); text-decoration: none; }
    .nav-links { display: flex; gap: 0.25rem; margin-left: auto; }
    .nav-link {
      padding: 0.4rem 0.875rem;
      border-radius: 6px;
      text-decoration: none;
      color: var(--gray-600);
      font-size: 0.875rem;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }
    .nav-link:hover, .nav-link.active { background: var(--gray-100); color: var(--accent); }

    .app { display: flex; flex: 1; overflow: hidden; }

    /* Sidebar */
    .sidebar {
      width: 256px;
      background: var(--white);
      border-right: 1px solid var(--gray-200);
      display: flex;
      flex-direction: column;
      padding: 1rem;
      gap: 0.875rem;
      flex-shrink: 0;
    }
    .btn-new {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.625rem 0.875rem;
      background: var(--accent);
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s;
    }
    .btn-new:hover { background: var(--accent-hover); }
    .domain-label { font-size: 0.78rem; font-weight: 600; color: var(--gray-700); }
    .domain-select {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--gray-200);
      border-radius: 8px;
      font-size: 0.875rem;
      background: var(--gray-50);
      outline: none;
      cursor: pointer;
      transition: border 0.15s;
    }
    .domain-select:focus { border-color: var(--accent); }
    .sidebar-label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gray-400);
    }
    .session-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.2rem; }
    .session-item {
      padding: 0.45rem 0.75rem;
      border-radius: 6px;
      font-size: 0.8rem;
      color: var(--gray-600);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.1s;
    }
    .session-item:hover { background: var(--gray-100); }
    .session-item.active { background: #eff6ff; color: var(--accent); font-weight: 600; }

    /* Chat main */
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 0 1.5rem;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 0;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 0.75rem;
      color: var(--gray-400);
    }
    .empty-state .icon { font-size: 2.5rem; }
    .empty-state p { font-size: 0.9rem; }

    .msg { display: flex; gap: 0.75rem; align-items: flex-start; }
    .msg.user { flex-direction: row-reverse; }
    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .avatar.ai { background: #eff6ff; color: var(--accent); }
    .avatar.user { background: var(--accent); color: var(--white); }
    .bubble {
      max-width: 72%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .msg.user .bubble { background: var(--accent); color: var(--white); border-bottom-right-radius: 3px; }
    .msg.ai .bubble { background: var(--white); border: 1px solid var(--gray-200); border-bottom-left-radius: 3px; }

    .sources { margin-top: 0.75rem; display: flex; flex-direction: column; gap: 0.35rem; }
    .source-card {
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: 8px;
      padding: 0.45rem 0.75rem;
      font-size: 0.775rem;
      color: var(--gray-600);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .source-info { display: flex; flex-direction: column; gap: 0.25rem; min-width: 0; flex: 1; }
    .source-card a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .source-card a:hover { text-decoration: underline; }
    .pos-row { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .pos-tag {
      font-size: 0.68rem;
      padding: 0.1rem 0.45rem;
      border-radius: 4px;
      background: #eff6ff;
      color: var(--accent);
      text-decoration: none;
      white-space: nowrap;
    }
    a.pos-tag:hover { background: #dbeafe; text-decoration: none; }
    .conf-tag {
      margin-left: auto;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.1rem 0.4rem;
      border-radius: 99px;
      flex-shrink: 0;
    }
    .conf-high { background: #dcfce7; color: #15803d; }
    .conf-mid  { background: #fef9c3; color: #854d0e; }
    .conf-low  { background: #fee2e2; color: #b91c1c; }

    .typing span {
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--gray-400);
      border-radius: 50%;
      margin: 0 1px;
      animation: blink 1.2s infinite both;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }

    /* Input */
    .input-bar { padding: 1rem 0 1.25rem; display: flex; flex-direction: column; gap: 0.4rem; }
    .input-wrap {
      display: flex;
      align-items: flex-end;
      gap: 0.625rem;
      background: var(--white);
      border: 1.5px solid var(--gray-200);
      border-radius: 12px;
      padding: 0.625rem 0.875rem;
      transition: border 0.15s;
    }
    .input-wrap:focus-within { border-color: var(--accent); }
    textarea {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--gray-800);
      background: transparent;
      max-height: 160px;
      line-height: 1.5;
    }
    .send-btn {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: var(--accent);
      color: var(--white);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .send-btn:hover { background: var(--accent-hover); }
    .send-btn:disabled { background: var(--gray-200); cursor: not-allowed; }
    .hint { font-size: 0.7rem; color: var(--gray-400); text-align: center; }

    @media (max-width: 640px) {
      .sidebar { display: none; }
      .chat-main { padding: 0 0.75rem; }
    }
  </style>
</head>
<body>
  <nav>
    <a class="nav-brand" href="index.html">Tri Thức</a>
    <div class="nav-links">
      <a class="nav-link" href="index.html">Trang chủ</a>
      <a class="nav-link active" href="chat.html">Chat</a>
      <a class="nav-link" href="ingest.html">Nạp dữ liệu</a>
      <a class="nav-link" href="knowledge.html">Kho tri thức</a>
    </div>
  </nav>

  <div class="app">
    <aside class="sidebar">
      <button class="btn-new" id="newChatBtn">+ Cuộc hội thoại mới</button>
      <div class="domain-label">Lĩnh vực chuyên gia</div>
      <select class="domain-select" id="domainSelect">
        <option value="general">Tất cả lĩnh vực</option>
        <option value="education">Giáo dục</option>
        <option value="technology">Công nghệ</option>
        <option value="science">Khoa học</option>
        <option value="business">Kinh doanh</option>
        <option value="health">Y tế & Sức khỏe</option>
      </select>
      <div class="sidebar-label">Lịch sử</div>
      <div class="session-list" id="sessionList"></div>
    </aside>

    <main class="chat-main">
      <div class="messages" id="messages">
        <div class="empty-state">
          <div class="icon">💬</div>
          <p>Đặt câu hỏi để bắt đầu trò chuyện</p>
        </div>
      </div>
      <div class="input-bar">
        <div class="input-wrap">
          <textarea id="inputBox" rows="1" placeholder="Nhập câu hỏi của bạn..."></textarea>
          <button class="send-btn" id="sendBtn">➤</button>
        </div>
        <div class="hint">Enter để gửi · Shift+Enter để xuống dòng</div>
      </div>
    </main>
  </div>

  <script type="module">
    const API_BASE = '';

    let sessionId = localStorage.getItem('ttt_session_id') || crypto.randomUUID();
    localStorage.setItem('ttt_session_id', sessionId);

    let sessions = JSON.parse(localStorage.getItem('ttt_sessions') || '[]');
    let currentSessionId = sessionId;

    const messagesEl = document.getElementById('messages');
    const inputBox = document.getElementById('inputBox');
    const sendBtn = document.getElementById('sendBtn');

    function renderSessionList() {
      const list = document.getElementById('sessionList');
      list.innerHTML = '';
      [...sessions].reverse().forEach(s => {
        const el = document.createElement('div');
        el.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
        el.textContent = s.title || 'Cuộc hội thoại';
        el.title = s.title || '';
        el.addEventListener('click', () => loadSession(s.id));
        list.appendChild(el);
      });
    }

    function loadSession(id) {
      currentSessionId = id;
      const s = sessions.find(x => x.id === id);
      messagesEl.innerHTML = '';
      if (!s || !s.messages || !s.messages.length) {
        showEmpty();
      } else {
        s.messages.forEach(m => addBubble(m.role, m.content, m.sources, false));
      }
      renderSessionList();
    }

    function showEmpty() {
      messagesEl.innerHTML = `<div class="empty-state"><div class="icon">💬</div><p>Đặt câu hỏi để bắt đầu trò chuyện</p></div>`;
    }

    function clearEmpty() {
      const e = messagesEl.querySelector('.empty-state');
      if (e) e.remove();
    }

    function ensureSession() {
      if (!sessions.find(s => s.id === currentSessionId)) {
        sessions.push({ id: currentSessionId, title: '', messages: [] });
      }
    }

    function saveMessage(role, content, sources) {
      ensureSession();
      const s = sessions.find(x => x.id === currentSessionId);
      s.messages = s.messages || [];
      s.messages.push({ role, content, sources });
      if (!s.title && role === 'user') s.title = content.slice(0, 48);
      localStorage.setItem('ttt_sessions', JSON.stringify(sessions));
      renderSessionList();
    }

    function confInfo(score) {
      if (score == null) return null;
      if (score >= 0.75) return { cls: 'conf-high', label: 'Cao' };
      if (score >= 0.4)  return { cls: 'conf-mid',  label: 'TB' };
      return { cls: 'conf-low', label: 'Thấp' };
    }

    function buildSourcesHTML(sources) {
      if (!sources || !sources.length) return '';
      const items = sources.map(src => {
        const title = src.title || src.source || 'Nguồn';
        const baseUrl = src.url || src.youtube_url || null;
        const score = src.score ?? src.confidence;
        const conf = confInfo(score);
        const badge = conf ? `<span class="conf-tag ${conf.cls}">${conf.label}</span>` : '';

        // Build position tags (timestamps / pages)
        let posHTML = '';
        const positions = src.positions || [];
        if (positions.length > 0) {
          const tags = positions.map(p => {
            if (p.timestamp) {
              const href = p.url || baseUrl;
              return href
                ? `<a href="${href}" target="_blank" rel="noopener" class="pos-tag">&#9654; ${p.timestamp}</a>`
                : `<span class="pos-tag">&#9654; ${p.timestamp}</span>`;
            }
            if (p.page != null) {
              return `<span class="pos-tag">&#128196; Trang ${p.page}</span>`;
            }
            return '';
          }).filter(Boolean).join('');
          if (tags) posHTML = `<div class="pos-row">${tags}</div>`;
        } else if (src.timestamp) {
          const href = baseUrl;
          const tag = href
            ? `<a href="${href}" target="_blank" rel="noopener" class="pos-tag">&#9654; ${src.timestamp}</a>`
            : `<span class="pos-tag">&#9654; ${src.timestamp}</span>`;
          posHTML = `<div class="pos-row">${tag}</div>`;
        } else if (src.page != null) {
          posHTML = `<div class="pos-row"><span class="pos-tag">&#128196; Trang ${src.page}</span></div>`;
        }

        const titleHTML = baseUrl
          ? `<a href="${baseUrl}" target="_blank" rel="noopener">${title}</a>`
          : `<span>${title}</span>`;
        return `<div class="source-card"><div class="source-info">${titleHTML}${posHTML}</div>${badge}</div>`;
      }).join('');
      return `<div class="sources">${items}</div>`;
    }

    function addBubble(role, text, sources, save = true) {
      clearEmpty();
      const msg = document.createElement('div');
      msg.className = `msg ${role}`;
      const av = document.createElement('div');
      av.className = `avatar ${role}`;
      av.textContent = role === 'user' ? 'Bạn' : 'AI';
      const bbl = document.createElement('div');
      bbl.className = 'bubble';
      bbl.textContent = text;
      if (role === 'ai' && sources && sources.length) {
        bbl.insertAdjacentHTML('beforeend', buildSourcesHTML(sources));
      }
      msg.appendChild(av);
      msg.appendChild(bbl);
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      if (save) saveMessage(role, text, sources);
      return bbl;
    }

    function addTyping() {
      clearEmpty();
      const msg = document.createElement('div');
      msg.className = 'msg ai';
      msg.id = 'typing-msg';
      msg.innerHTML = `<div class="avatar ai">AI</div><div class="bubble typing"><span></span><span></span><span></span></div>`;
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    function removeTyping() { document.getElementById('typing-msg')?.remove(); }

    async function send() {
      const text = inputBox.value.trim();
      if (!text || sendBtn.disabled) return;
      inputBox.value = '';
      inputBox.style.height = 'auto';
      sendBtn.disabled = true;

      ensureSession();
      addBubble('user', text);
      addTyping();

      try {
        const resp = await fetch(`${API_BASE}/api/chat/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: text,
            session_id: currentSessionId,
            domain: document.getElementById('domainSelect').value,
            history: []
          })
        });
        removeTyping();
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        addBubble('ai', data.answer, data.sources || []);
      } catch (err) {
        removeTyping();
        addBubble('ai', `Lỗi kết nối: ${err.message}. Kiểm tra server đang chạy tại localhost:8000.`);
      } finally {
        sendBtn.disabled = false;
        inputBox.focus();
      }
    }

    inputBox.addEventListener('input', () => {
      inputBox.style.height = 'auto';
      inputBox.style.height = Math.min(inputBox.scrollHeight, 160) + 'px';
    });
    inputBox.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    sendBtn.addEventListener('click', send);

    document.getElementById('newChatBtn').addEventListener('click', () => {
      currentSessionId = crypto.randomUUID();
      localStorage.setItem('ttt_session_id', currentSessionId);
      showEmpty();
      renderSessionList();
    });

    renderSessionList();
  </script>
</body>
</html>
